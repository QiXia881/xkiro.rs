services:
  xkiro-rs:
    # 使用国内镜像
    # image: ghcr.nju.edu.cn/${IMAGE_OWNER:-qixia881}/xkiro-rs:${IMAGE_TAG:-latest}
    image: ghcr.io/${IMAGE_OWNER:-qixia881}/xkiro-rs:${IMAGE_TAG:-latest}
    container_name: xkiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KIRO_SSO_CALLBACK_BIND: "0.0.0.0"
    ports:
      - "8990:8990"
      - "127.0.0.1:3128:3128"
    volumes:
      - ./config/:/app/config/
    restart: unless-stopped
